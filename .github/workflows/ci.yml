name: ci

# Mirrors the ship skill's step 0 (preflight: typecheck + lint + test +
# check-deps) exactly rather than inventing separate CI-only logic -- what
# runs here is what any session already runs by hand before opening a PR,
# just automated instead of relying on that being remembered every time.
#
# This is the backstop for the local pre-commit hook (.githooks/pre-commit,
# wired in via `git config core.hooksPath .githooks`) rather than a
# redundant re-check: the hook is opt-in per clone and skips itself
# silently when the tools aren't wired up, so this is what actually blocks
# a regression on a contributor who never installed the hooks.
#
# Scripts that don't exist yet are skipped with a visible note rather than
# failed: a repo mid-scaffold can't check what it hasn't wired up. A green
# run that skipped a check says so in the log -- read it, don't just read
# the checkmark.
#
# Assumes npm -- settled in AGENTS.md's State section (npm, lockfile
# package-lock.json), not an open choice. If that ever changes, adjust
# install + run to match, including the setup action the new manager needs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck + lint + test + check-deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches nodejs_24 in flake.nix -- the toolchain decision AGENTS.md's
          # State section records. If the flake's pin moves, move this with it.
          node-version: 24

      # npm 11 exits 254 on a missing package.json for BOTH ci and install,
      # so a bare `npm ci || npm install` red-flagged the whole job on a repo
      # mid-scaffold (2026-08-31, the bootstrap PR) -- as the first step it
      # never let the skip-with-warning steps below run. Gated like they are.
      - name: install (if wired up)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "::warning::no package.json -- install skipped"
          fi

      - name: typecheck (if wired up)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)" 2>/dev/null; then
            npm run typecheck
          else
            echo "::warning::no 'typecheck' script in package.json -- skipped"
          fi

      - name: lint (if wired up)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            npm run lint
          else
            echo "::warning::no 'lint' script in package.json -- skipped"
          fi

      - name: test (if wired up)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            npm run test --if-present
          else
            echo "::warning::no 'test' script in package.json -- skipped"
          fi

      - name: check-deps (if wired up)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check-deps'] ? 0 : 1)" 2>/dev/null; then
            npm run check-deps
          else
            echo "::warning::no 'check-deps' script in package.json -- skipped"
          fi
